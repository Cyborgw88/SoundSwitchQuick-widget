name: Build SoundSwitchQuick EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\SoundSwitchQuick.csproj

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          dotnet publish .\SoundSwitchQuick.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o "$env:GITHUB_WORKSPACE\publish"

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\publish\SoundSwitchQuick.exe"
          if (-not (Test-Path $exe)) {
            throw 'SoundSwitchQuick.exe was not produced.'
          }
          $file = Get-Item $exe
          Write-Host "EXE ready: $($file.FullName)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: SoundSwitchQuick-Windows-x64
          path: publish/SoundSwitchQuick.exe
          if-no-files-found: error
          retention-days: 30
